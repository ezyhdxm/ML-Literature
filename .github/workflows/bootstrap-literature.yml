name: Bootstrap literature notebook

on:
  push:
    branches: [main]
    paths:
      - "bootstrap_generator.py"
      - "bootstrap_payload/**"
      - ".github/workflows/bootstrap-literature.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Generate repository structure
        run: python bootstrap_generator.py
      - name: Build HTML
        run: bash reports/tabular-blackbox-2026/build.sh
      - name: Remove bootstrap files
        run: rm -rf bootstrap_generator.py bootstrap_payload .github/workflows/bootstrap-literature.yml
      - name: Commit literature notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add tabular ML literature notebook and paper reading folders"
          git push
